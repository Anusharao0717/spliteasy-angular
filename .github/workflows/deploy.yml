
name: Deploy SplitEasy to GitHub Pages

on:
  push:
    branches:
      - updated-codes

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    name: Build Angular Application
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Check project files
      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Checking package.json:"
          test -f package.json

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Build Angular application
      - name: Build Angular
        run: |
          npx ng build --configuration production --base-href=/spliteasy-angular/

      # 6. Find Angular output
      - name: Locate Angular build output
        run: |
          echo "Searching for index.html..."
          find dist -name index.html -type f

          INDEX_FILE=$(find dist -name index.html -type f | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: Angular index.html not found!"
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")

          echo "Angular output directory: $OUTPUT_DIR"

          mkdir -p pages
          cp -R "$OUTPUT_DIR"/. pages/

          touch pages/.nojekyll
          cp pages/index.html pages/404.html

          echo "Final deployment files:"
          ls -la pages

      # 7. Upload website files
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 8. Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
